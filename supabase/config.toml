# Edge Functions default to verify_jwt = true, and every function in this
# project wants that — they all call callerId() and act on behalf of a real
# session.
#
# calendar-connect is the single exception, and it is not a preference: the
# OAuth provider redirects the *browser* back to it with no Authorization
# header, so the gateway would reject Google's callback before the function ever
# ran. It is declared here rather than passed as a --no-verify-jwt flag so that
# a routine `supabase functions deploy` cannot quietly re-secure it and break
# calendar connections. The function verifies its own callers instead: the
# `state` parameter is an AES-GCM envelope we minted, and anything else fails to
# open.
[functions.calendar-connect]
verify_jwt = false

# spend-ingest is the second exception, and the reason is structural rather than
# a preference. It is called by an iOS App Intent that an Apple Pay Personal
# Automation woke on a locked phone: there is no session behind it and there can
# never be one, so the gateway's JWT check would reject every legitimate post.
# The per-device token minted by spend-enroll is the security boundary, and the
# function checks it itself. Declared here rather than passed as a
# --no-verify-jwt flag so a routine `supabase functions deploy` cannot quietly
# re-secure it and leave spend tracking silently dead.
[functions.spend-ingest]
verify_jwt = false

# store-webhook is the third exception. App Store Server Notifications V2 are
# posted by Apple's servers with no Authorization header — there is no session
# behind a renewal at 3am — so the gateway's JWT check would reject every one
# and Apple would retry them into the void. The function verifies each
# notification's JWS against Apple's pinned root itself (_shared/app_store.ts),
# and that signature is the whole security boundary. Declared here rather than
# passed as a --no-verify-jwt flag so a routine `supabase functions deploy`
# cannot quietly re-secure it and freeze every household's plan where it is.
# (store-verify is *not* an exception: the app calls it with a real session.)
[functions.store-webhook]
verify_jwt = false
