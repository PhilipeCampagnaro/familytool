name: aporah
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # German month names and 24-hour clock in the date/time pickers behind the
  # event form — the only UI text in the app Flutter supplies rather than us.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  flutter_svg: ^2.3.0
  supabase_flutter: ^2.16.0
  # Already present transitively (supabase_flutter pulls it in); named here
  # because lib/services/calendar_cache.dart imports it directly.
  path_provider: ^2.1.6
  # Open-Meteo is a plain HTTPS API with no SDK and no key, called directly from
  # lib/data/repositories/weather_repository.dart. Also already present
  # transitively, and named here for the same reason as path_provider.
  http: ^1.6.0

  # --- Android only ------------------------------------------------------
  #
  # Every one of these is a no-op on iOS, where the same job is done by a method
  # channel into UIKit. That split is deliberate rather than inconsistent: the
  # iOS side takes the native route because the app is *built* on iOS system
  # controls — a real UITabBar, Liquid Glass, UIMenu — and a plugin's
  # approximation next to the real thing is exactly what the design avoids.
  # Android has no such requirement, and hand-writing SAF, the photo picker and
  # a FileProvider in Kotlin would be several hundred lines to land in the same
  # place these do.
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  # **12, not 8.** file_picker 8 is compiled against android-34, and a
  # transitive `flutter_plugin_android_lifecycle` now requires every dependent
  # to compile against 36 — which fails the Android build outright at
  # `checkDebugAarMetadata`, not at runtime. The single call site
  # (`FilePicker.platform.pickFiles`) is unchanged across the jump.
  file_picker: ^12.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/grocery/
    - assets/merchants/
    - assets/onboarding/
    - assets/calendar_providers/
    # Meteocons (github.com/basmilius/meteocons), MIT — the licence sits beside
    # them in assets/weather/LICENSE and ships with them. Only the ten the eight
    # WeatherConditions map onto are vendored, out of 535; see
    # `WeatherReading.iconAsset`.
    - assets/weather/

  # Poppins is **bundled, not fetched**. It used to come from `google_fonts` at
  # runtime, which registers each weight under a variant-suffixed family
  # (`Poppins_regular`, `Poppins_600`, ...) — never plain `Poppins`. Every
  # `AppText` token and every hand-written `TextStyle` in the app asks for
  # `'Poppins'`, so they all silently fell back to the platform font while
  # unstyled text rendered in real Poppins: two typefaces on one screen.
  # Declaring the family here is what makes `fontFamily: 'Poppins'` mean
  # something. Only the weights the app actually uses are shipped; adding a new
  # one to `AppText` means adding its .ttf here too.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

    # Phosphor Duotone (phosphoricons.com), MIT — the licence sits beside it in
    # assets/icons/LICENSE. Unlike the Meteocons above, that directory is *not*
    # in `assets:`: a font declared here is already bundled, and listing the
    # folder as well would ship a second, un-tree-shaken 567 KB copy of it. The
    # licence therefore lives in the repo beside the font rather than inside the
    # app.
    #
    # **Vendored rather than depended on.** `phosphor_flutter` is the obvious
    # way to get this, and it does not compile: its `PhosphorIconData extends
    # IconData`, and Flutter has since made `IconData` a final class. The
    # package has not shipped since May 2024, so there is no fixed version to
    # wait for. `flutter analyze` does not catch it — only the compiler does —
    # so a green analyze on this dependency meant nothing.
    #
    # The one font is all the package was really worth here: a duotone glyph is
    # two codepoints in this file, drawn on top of each other, which
    # `lib/theme/app_icons.dart` does in a dozen lines. Two of the six weights
    # are vendored: Duotone for a glyph that names a thing, Regular for one that
    # is a control.
    - family: PhosphorDuotone
      fonts:
        - asset: assets/icons/Phosphor-Duotone.ttf
    # The same set's Regular weight, for every icon drawn flat — a control's
    # glyph, and the fourteen bare marks. Not the duotone with its under-layer
    # switched off: Phosphor draws several icons differently in the two weights,
    # and `caret-right` is a hollow triangle in one and a chevron in the other.
    #
    # **This was Bold, and the reason it was is worth keeping.** A flat glyph
    # was drawn at an em of 19, which puts about 15pt of ink on screen — a
    # Phosphor glyph fills 57–86% of its em — where iOS's own bar button draws
    # 21pt. Bold was how a glyph that small was kept from reading as faint.
    # Sized correctly (see `AppGlyph` in lib/theme/tokens.dart) Bold is 39%
    # heavier than the symbol beside it, and Regular lands within a tenth of a
    # point of Apple's stroke. Every Phosphor weight uses the same codepoint per
    # glyph, so this line is the only thing that picks the weight. See `_flat`
    # in lib/theme/app_icons.dart.
    - family: PhosphorRegular
      fonts:
        - asset: assets/icons/Phosphor-Regular.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
