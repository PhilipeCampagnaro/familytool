<!doctype html>
<!-- aporah.io's front page. Deliberately almost empty until there is a store
     listing to link to; the domain exists today for the /invite and /share
     links (open.html) and the app-association file in .well-known/. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aporah</title>
  <style>
    :root { --bg: #f5f6f8; --ink: #16181d; --muted: #6b7280; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e0f12; --ink: #f3f4f6; --muted: #9ca3af; } }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px 16px; text-align: center; background: var(--bg); color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 32px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <h1>aporah</h1>
  <p>Kalender, Listen, Aufgaben und Boxen für die ganze Familie. Bald im App Store.</p>
</body>
</html>
